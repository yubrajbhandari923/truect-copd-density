[project]
name = "truect-copd-density"
version = "0.1.0"
description = "Supervised CT-to-DukeSim phantom inference on TrueCT COPD (plan-001)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pydicom>=3.0",
    "openpyxl>=3.1",
    "matplotlib>=3.9",
    # CUDA 12.6 build (driver 565.57.01 / CUDA 12.7 on node001-004), installed from
    # https://download.pytorch.org/whl/cu126; verified 2.14.1+cu126 on a GPU node (E02 smoke).
    "torch>=2.14",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
