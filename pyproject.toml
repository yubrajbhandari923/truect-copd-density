[project]
name = "truect-copd-density"
version = "0.1.0"
description = "Supervised CT-to-DukeSim phantom inference on TrueCT COPD (plan-001)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pydicom>=3.0",
    "openpyxl>=3.1",
    "matplotlib>=3.9",
]

# torch is added (with a CUDA build verified on a GPU node) when E01/E02 need it.
[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
